<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NexoTerraCore</title><style>
:root{--n:#0b1428;--c:#13213c;--d:#d7a84a;--t:#eef4ff;--m:#aab9d5}*{box-sizing:border-box}body{margin:0;background:var(--n);color:var(--t);font:16px Arial}header,main{max-width:850px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center}b{font-size:21px}b span,.hero p{color:var(--d)}small,.muted{color:var(--m)}button,input{font:inherit;border-radius:12px;padding:13px;border:1px solid #35507d}button{background:var(--c);color:var(--t);cursor:pointer}.hero,#area,.cards div,.menu button{background:var(--c);border:1px solid #22395f;border-radius:16px}.hero,#area{padding:20px}.hero h1{margin:6px 0}.cards,.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:15px 0}.cards div{padding:16px}.cards strong{font-size:25px;display:block;color:var(--d);margin-top:6px}.menu button{text-align:left;min-height:70px;font-weight:bold}form{display:grid;gap:10px;margin-top:15px}input{width:100%;background:#091326;color:#fff}form button{background:var(--d);color:#141414;border:0;font-weight:bold}.item{border-top:1px solid #294267;padding:12px 0;display:flex;justify-content:space-between;gap:10px}@media(max-width:600px){header,main{padding:14px}.cards,.menu{grid-template-columns:repeat(2,1fr)}header button{font-size:12px;padding:9px}}
</style></head><body><header><div><b>NEXOTERRA<span>CORE</span></b><small>Central Inteligente de Gestão Rural</small></div><button onclick="exp()">Exportar dados</button></header><main><section class="hero"><p>FAZENDA PIPE</p><h1>Painel do gerente</h1><small id="data"></small></section><section id="cards" class="cards"></section><section class="menu"><button onclick="abrir('producao')">🌾 Produção</button><button onclick="abrir('financeiro')">R$ Financeiro</button><button onclick="abrir('atividades')">✓ Atividades</button><button onclick="abrir('maquinas')">⚙ Máquinas</button><button onclick="abrir('diagnostico')">! Diagnóstico</button></section><section id="area"></section></main><script>
const M={producao:['Produto','Quantidade'],financeiro:['Descrição','Valor'],atividades:['Atividade','Responsável'],maquinas:['Máquina','Horímetro'],diagnostico:['Problema','Prioridade']},g=x=>document.getElementById(x),ler=k=>JSON.parse(localStorage.getItem('nexoterra_'+k)||'[]'),salvar=(k,v)=>localStorage.setItem('nexoterra_'+k,JSON.stringify(v));g('data').textContent=new Date().toLocaleDateString('pt-BR',{dateStyle:'full'});
function painel(){let p=ler('producao'),f=ler('financeiro'),a=ler('atividades'),m=ler('maquinas');g('cards').innerHTML=`<div>Produções<strong>${p.length}</strong></div><div>Saldo<strong>R$ ${f.reduce((s,x)=>s+Number(x.b||0),0).toFixed(2)}</strong></div><div>Atividades<strong>${a.length}</strong></div><div>Máquinas<strong>${m.length}</strong></div>`}
function abrir(k){let [a,b]=M[k],r=ler(k);g('area').innerHTML=`<h2>${k[0].toUpperCase()+k.slice(1)}</h2><p class="muted">Registros salvos neste aparelho.</p><form id="form"><input required name="a" placeholder="${a}"><input required name="b" placeholder="${b}" ${k==='financeiro'||k==='maquinas'?'type="number"':''}><input type="date" name="data" value="${new Date().toISOString().slice(0,10)}"><button>Salvar registro</button></form>${r.slice().reverse().map((x,i)=>`<div class="item"><span><b>${x.a}</b><br><small>${x.b} · ${x.data}</small></span><button onclick="apagar('${k}',${r.length-1-i})">Excluir</button></div>`).join('')||'<p class="muted">Nenhum registro ainda.</p>'}`;g('form').onsubmit=e=>{e.preventDefault();salvar(k,[...r,Object.fromEntries(new FormData(e.target))]);abrir(k);painel()}}
function apagar(k,i){let r=ler(k);r.splice(i,1);salvar(k,r);abrir(k);painel()}function exp(){let d={};Object.keys(M).forEach(k=>d[k]=ler(k));let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)]));a.download='nexoterracore-dados.json';a.click()}painel();abrir('producao');
</script></body></html>
