<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexoTerraCore — Sala de Comando</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

  <div class="app-shell">

    <aside class="sidebar">
      <div class="brand">
        <strong>NexoTerraCore</strong>
        <span>Sala de Comando</span>
      </div>

      <nav class="menu">
        <button>Visão Geral</button>
        <button>Patrimônio</button>
        <button>Imóveis</button>
        <button>Agro</button>
        <button>Financeiro</button>
        <button>Mapas</button>
        <button>API / Control Plane</button>
        <button>Administração</button>
      </nav>

      <div class="sidebar-footer">
        Gustavo Admin
      </div>
    </aside>

    <main class="workspace">

      <header class="topbar">
        <div>
          <h1>Sala de Comando</h1>
          <p>NexoTerraCore</p>
        </div>

        <div class="system-status">
          <span>API</span>
          <strong>Aguardando conexão</strong>
        </div>
      </header>

      <section class="content">
        <h2>Visão Geral</h2>
        <p>Ambiente administrativo privado do NexoTerraCore.</p>
      </section>

    </main>

  </div>

  <script src="./js/app.js"></script>
</body>
</html>
