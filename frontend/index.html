<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071426">
  <title>NexoTerraCore | Fazenda Digital</title>
  <style>
    *{box-sizing:border-box} :root{--bg:#071426;--panel:#132e4d;--field:#0b1e33;--gold:#f4c542;--gold2:#8b6800;--text:#f8fafc;--soft:#cbd5e1;--border:#3d6b91;--ok:#7ee787;--warn:#ffcc66;--danger:#ff7b72}
    body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:var(--text);background:linear-gradient(160deg,#071426,#0f2742)}
    header{padding:26px 5%;border-bottom:2px solid var(--gold2)} header h1{margin:0;color:var(--gold);font-size:clamp(30px,5vw,48px)} header p{margin:6px 0 0;color:var(--soft);font-size:19px}
    main{width:min(94%,980px);margin:32px auto;padding:30px;background:var(--panel);border:1px solid var(--border);border-radius:18px} h2{margin-top:0;font-size:clamp(27px,4vw,39px)} h3{margin-top:30px;color:var(--gold)} p{color:var(--soft);font-size:17px;line-height:1.5}
    .resumo{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:24px 0}.indicador,.registro{padding:16px;background:var(--field);border:1px solid var(--border);border-radius:10px}.indicador strong{display:block;color:var(--gold);font-size:24px}.indicador span,.registro span{display:block;margin-top:5px;color:var(--soft)}
    .modulos,.historico,form{display:grid;gap:12px} button{width:100%;padding:17px;color:var(--text);background:var(--gold2);border:0;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer}button:hover{filter:brightness(1.15)}button.secundario{background:#294b6d}
    label{margin-top:7px;font-size:17px;font-weight:bold}input,select,textarea{width:100%;padding:14px;color:var(--text);background:var(--field);border:1px solid #5b7794;border-radius:8px;font:17px Arial}textarea{min-height:100px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid var(--gold)}
    .registro{border-left:4px solid var(--gold)}.acoes-registro{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.registro button{width:auto;margin:0;padding:9px 12px;background:#7b3434;font-size:14px}.registro button.editar{background:var(--gold2)}button.cancelar-edicao{background:#294b6d}.status-ok{color:var(--ok)}.status-warn{color:var(--warn)}.status-danger{color:var(--danger)}.mensagem{color:var(--ok);font-weight:bold}.nota{padding:12px;border:1px solid var(--border);border-radius:8px;background:#0b1e33}
    @media(max-width:600px){main{width:94%;margin:20px auto;padding:20px}.resumo{grid-template-columns:1fr}header{padding:22px 4%}}
  </style>
</head>
<body>
  <header><h1>NexoTerraCore</h1><p>Central Inteligente de Gestão Rural</p></header>
  <main id="painel"></main>
  <script>
    const ler=c=>{try{return JSON.parse(localStorage.getItem(c))||[]}catch{return[]}};
    const gravar=(c,r)=>{const a=ler(c);a.push(r);localStorage.setItem(c,JSON.stringify(a))};
    const hoje=()=>new Date().toISOString().split('T')[0];
    const API='http://localhost:3000/api';
    let maquinaEmEdicao=null;
    let financeiroEmEdicao=null;
    const dinheiro=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
    const escapar=t=>String(t??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
    const ultimos=(chave,render)=>{const a=ler(chave).slice().reverse().slice(0,5);return a.length?a.map(render).join(''):'<p>Nenhum registro ainda.</p>'};
    async function listarMaquinasApi(){const r=await fetch(`${API}/maquinas`);if(!r.ok)throw new Error('API indisponível');return r.json()}
    async function listarFinanceiroApi(){const r=await fetch(`${API}/financeiro`);if(!r.ok)throw new Error('API indisponível');return r.json()}
    async function resumoFinanceiroApi(){const r=await fetch(`${API}/financeiro/resumo`);if(!r.ok)throw new Error('API indisponível');return r.json()}
    async function abrirPainel(){
      const p=ler('nexoterra_producao'),a=ler('nexoterra_atividades'),d=ler('nexoterra_diagnosticos');let m=[],resumo={saldo:0},conexao='PostgreSQL conectado';try{[m,resumo]=await Promise.all([listarMaquinasApi(),resumoFinanceiroApi()])}catch{conexao='Backend indisponível'}
      document.querySelector('#painel').innerHTML=`<h2>Painel do gerente</h2><p>Visão direta da Fazenda Pipe: produção, custos, trabalho e máquinas.</p><div class="nota"><strong>Dados integrados:</strong> ${conexao}</div><section class="resumo">
      <div class="indicador"><strong>${p.length}</strong><span>Produções</span></div><div class="indicador"><strong>${dinheiro(resumo.saldo)}</strong><span>Saldo</span></div><div class="indicador"><strong>${a.length}</strong><span>Atividades</span></div><div class="indicador"><strong>${m.length}</strong><span>Registros de máquinas</span></div></section>
      <section class="modulos"><button onclick="abrirMaquinas()">Central de Máquinas</button><button onclick="abrirProducao()">Produção</button><button onclick="abrirFinanceiro()">Financeiro</button><button onclick="abrirAtividades()">Atividades</button><button onclick="abrirDiagnostico()">Diagnóstico</button></section>`;
    }
    function tela(titulo,descricao,form,historico){document.querySelector('#painel').innerHTML=`<h2>${titulo}</h2><p>${descricao}</p>${form}<p id="mensagem" class="mensagem"></p><h3>Últimos registros</h3><div class="historico">${historico}</div>`}
    const voltar='<button class="secundario" type="button" onclick="abrirPainel()">Voltar ao painel</button>';
    async function abrirMaquinas(mensagem=''){
      maquinaEmEdicao=null;
      document.querySelector('#painel').innerHTML='<h2>Central de Máquinas</h2><p>Carregando dados do PostgreSQL...</p>';
      let registros=[];
      try{registros=await listarMaquinasApi()}catch{document.querySelector('#painel').innerHTML=`<h2>Central de Máquinas</h2><p class="status-danger">Backend indisponível. Confirme se a API está iniciada na porta 3000.</p>${voltar}`;return}
      const hist=registros.length?registros.map(i=>{const alerta=Number(i.horimetro)>=Number(i.proxima_revisao);return `<div class="registro"><strong>${escapar(i.nome)} — ${escapar(i.operacao)}</strong><span>Modelo: ${escapar(i.modelo||'Não informado')} | Série: ${escapar(i.numero_serie||'Não informada')} | Status: ${escapar(i.status)}</span><span>${escapar(String(i.data_operacao).slice(0,10))} | Horímetro: ${escapar(i.horimetro)} h | Próxima revisão: ${escapar(i.proxima_revisao)} h | Combustível: ${escapar(i.combustivel)} L</span>${i.observacao?`<span>${escapar(i.observacao)}</span>`:''}<span class="${alerta?'status-danger':'status-ok'}">${alerta?'REVISÃO VENCIDA':'Operação normal'}</span><div class="acoes-registro"><button class="editar" onclick="editarMaquina(${Number(i.id)})">Editar</button><button onclick="excluirMaquina(${Number(i.id)})">Excluir</button></div></div>`}).join(''):'<p>Nenhum registro ainda.</p>';
      tela('Central de Máquinas','Cadastre, consulte, edite e exclua máquinas com armazenamento real no PostgreSQL.',`<div class="nota"><strong>Armazenamento:</strong> API NexoTerraCore conectada ao PostgreSQL.</div><form id="form-maquina" onsubmit="salvarMaquina(event)">
      <label>Máquina</label><input name="maquina" maxlength="120" placeholder="Exemplo: Trator principal" required><label>Modelo</label><input name="modelo" maxlength="120" placeholder="Exemplo: John Deere 6110J"><label>Número de série</label><input name="numeroSerie" maxlength="120" placeholder="Exemplo: JD6110-001"><label>Operação</label><select name="operacao" required><option value="">Selecione</option><option>Plantio</option><option>Colheita</option><option>Preparo do solo</option><option>Pulverização</option><option>Transporte</option><option>Manutenção</option></select>
      <label>Horímetro atual</label><input name="horimetro" type="number" min="0" step="0.1" required><label>Próxima revisão (horas)</label><input name="proximaRevisao" type="number" min="0" step="0.1" required><label>Combustível consumido (litros)</label><input name="combustivel" type="number" min="0" step="0.1" required><label>Data</label><input name="data" type="date" value="${hoje()}" required><label>Status</label><select name="status" required><option>Ativa</option><option>Manutenção</option><option>Inativa</option></select><label>Observação</label><textarea name="observacao" placeholder="Falhas, manutenção ou condição da máquina"></textarea><button id="salvar-maquina">Cadastrar máquina</button><button id="cancelar-edicao" class="cancelar-edicao" type="button" onclick="cancelarEdicao()" hidden>Cancelar edição</button>${voltar}</form>`,hist);
      if(mensagem)mostrarMensagem(mensagem,false);
    }
    function mostrarMensagem(texto,erro=false){const m=document.querySelector('#mensagem');if(!m)return;m.textContent=texto;m.style.color=erro?'var(--danger)':'var(--ok)'}
    async function salvarMaquina(e){
      e.preventDefault();const f=e.target,botao=document.querySelector('#salvar-maquina'),id=maquinaEmEdicao;
      botao.disabled=true;mostrarMensagem(id?'Atualizando...':'Salvando...');
      const dados={maquina:f.maquina.value,modelo:f.modelo.value,numeroSerie:f.numeroSerie.value,operacao:f.operacao.value,horimetro:Number(f.horimetro.value),proximaRevisao:Number(f.proximaRevisao.value),combustivel:Number(f.combustivel.value),data:f.data.value,status:f.status.value,observacao:f.observacao.value};
      try{const r=await fetch(id?`${API}/maquinas/${id}`:`${API}/maquinas`,{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(dados)});const x=await r.json().catch(()=>({}));if(!r.ok)throw new Error(x.erro||'Não foi possível salvar a máquina.');await abrirMaquinas(id?'Máquina atualizada no PostgreSQL.':'Máquina cadastrada no PostgreSQL.')}catch(erro){mostrarMensagem(erro.message,true);botao.disabled=false}
    }
    async function editarMaquina(id){
      mostrarMensagem('Carregando máquina...');
      try{const r=await fetch(`${API}/maquinas/${id}`);const i=await r.json().catch(()=>({}));if(!r.ok)throw new Error(i.erro||'Não foi possível carregar a máquina.');const f=document.querySelector('#form-maquina');maquinaEmEdicao=id;f.maquina.value=i.nome||'';f.modelo.value=i.modelo||'';f.numeroSerie.value=i.numero_serie||'';f.operacao.value=i.operacao||'';f.horimetro.value=i.horimetro;f.proximaRevisao.value=i.proxima_revisao;f.combustivel.value=i.combustivel;f.data.value=String(i.data_operacao).slice(0,10);f.status.value=i.status||'Ativa';f.observacao.value=i.observacao||'';document.querySelector('#salvar-maquina').textContent='Salvar alterações';document.querySelector('#cancelar-edicao').hidden=false;mostrarMensagem('Editando máquina. Altere os campos e salve.');f.scrollIntoView({behavior:'smooth',block:'start'});f.maquina.focus()}catch(erro){mostrarMensagem(erro.message,true)}
    }
    function cancelarEdicao(){abrirMaquinas('Edição cancelada.')}
    async function excluirMaquina(id){
      if(!confirm('Excluir esta máquina do banco?'))return;
      try{const r=await fetch(`${API}/maquinas/${id}`,{method:'DELETE'});if(!r.ok){const x=await r.json().catch(()=>({}));throw new Error(x.erro||'Não foi possível excluir a máquina.')}await abrirMaquinas('Máquina excluída do PostgreSQL.')}catch(erro){mostrarMensagem(erro.message,true)}
    }
    function abrirProducao(){const h=ultimos('nexoterra_producao',i=>`<div class="registro"><strong>${escapar(i.produto)} — ${escapar(i.quantidade)}</strong><span>${escapar(i.data)}</span></div>`);tela('Cadastro de produção','Registre a produção diária.',`<form onsubmit="salvarProducao(event)"><label>Produto</label><input name="produto" placeholder="Exemplo: milho" required><label>Quantidade</label><input name="quantidade" type="number" min="1" required><label>Data</label><input name="data" type="date" value="${hoje()}" required><button>Salvar produção</button>${voltar}</form>`,h)}
    function salvarProducao(e){e.preventDefault();const f=e.target;gravar('nexoterra_producao',{produto:f.produto.value,quantidade:Number(f.quantidade.value),data:f.data.value});abrirProducao();document.querySelector('#mensagem').textContent='Produção salva com sucesso.'}
    async function abrirFinanceiro(mensagem=''){
      financeiroEmEdicao=null;document.querySelector('#painel').innerHTML='<h2>Financeiro</h2><p>Carregando dados do PostgreSQL...</p>';let registros,resumo;
      try{[registros,resumo]=await Promise.all([listarFinanceiroApi(),resumoFinanceiroApi()])}catch{document.querySelector('#painel').innerHTML=`<h2>Financeiro</h2><p class="status-danger">Backend indisponível. Confirme se a API está iniciada na porta 3000.</p>${voltar}`;return}
      const h=registros.length?registros.map(i=>`<div class="registro"><strong>${escapar(i.tipo)} — ${dinheiro(i.valor)}</strong><span>${escapar(i.descricao)} | ${escapar(i.categoria)} | ${escapar(String(i.data_lancamento).slice(0,10))}</span>${i.observacao?`<span>${escapar(i.observacao)}</span>`:''}<div class="acoes-registro"><button class="editar" onclick="editarFinanceiro(${Number(i.id)})">Editar</button><button onclick="excluirFinanceiro(${Number(i.id)})">Excluir</button></div></div>`).join(''):'<p>Nenhum lançamento financeiro cadastrado.</p>';
      tela('Financeiro','Cadastre receitas e despesas com armazenamento real no PostgreSQL.',`<section class="resumo"><div class="indicador"><strong>${dinheiro(resumo.receitas)}</strong><span>Receitas</span></div><div class="indicador"><strong>${dinheiro(resumo.despesas)}</strong><span>Despesas</span></div><div class="indicador"><strong>${dinheiro(resumo.saldo)}</strong><span>Saldo</span></div></section><form id="form-financeiro" onsubmit="salvarFinanceiro(event)"><label>Descrição</label><input name="descricao" maxlength="160" required><label>Categoria</label><input name="categoria" maxlength="100" required><label>Valor</label><input name="valor" type="number" min="0.01" step="0.01" required><label>Data</label><input name="data" type="date" value="${hoje()}" required><label>Tipo</label><select name="tipo" required><option value="">Selecione</option><option>Receita</option><option>Despesa</option></select><label>Observação</label><textarea name="observacao"></textarea><button id="salvar-financeiro">Cadastrar lançamento</button><button id="cancelar-financeiro" class="cancelar-edicao" type="button" onclick="abrirFinanceiro('Edição cancelada.')" hidden>Cancelar edição</button>${voltar}</form>`,h);if(mensagem)mostrarMensagem(mensagem)
    }
    async function salvarFinanceiro(e){e.preventDefault();const f=e.target,id=financeiroEmEdicao,botao=document.querySelector('#salvar-financeiro');botao.disabled=true;mostrarMensagem(id?'Atualizando...':'Salvando...');const dados={descricao:f.descricao.value,categoria:f.categoria.value,valor:Number(f.valor.value),data:f.data.value,tipo:f.tipo.value,observacao:f.observacao.value};try{const r=await fetch(id?`${API}/financeiro/${id}`:`${API}/financeiro`,{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(dados)});const x=await r.json().catch(()=>({}));if(!r.ok)throw new Error(x.erro||'Não foi possível salvar o lançamento.');await abrirFinanceiro(id?'Lançamento atualizado no PostgreSQL.':'Lançamento cadastrado no PostgreSQL.')}catch(erro){mostrarMensagem(erro.message,true);botao.disabled=false}}
    async function editarFinanceiro(id){mostrarMensagem('Carregando lançamento...');try{const r=await fetch(`${API}/financeiro/${id}`),i=await r.json().catch(()=>({}));if(!r.ok)throw new Error(i.erro||'Não foi possível carregar o lançamento.');const f=document.querySelector('#form-financeiro');financeiroEmEdicao=id;f.descricao.value=i.descricao||'';f.categoria.value=i.categoria||'';f.valor.value=i.valor;f.data.value=String(i.data_lancamento).slice(0,10);f.tipo.value=i.tipo||'';f.observacao.value=i.observacao||'';document.querySelector('#salvar-financeiro').textContent='Salvar alterações';document.querySelector('#cancelar-financeiro').hidden=false;mostrarMensagem('Editando lançamento. Altere os campos e salve.');f.scrollIntoView({behavior:'smooth',block:'start'});f.descricao.focus()}catch(erro){mostrarMensagem(erro.message,true)}}
    async function excluirFinanceiro(id){if(!confirm('Excluir este lançamento do PostgreSQL?'))return;try{const r=await fetch(`${API}/financeiro/${id}`,{method:'DELETE'});if(!r.ok){const x=await r.json().catch(()=>({}));throw new Error(x.erro||'Não foi possível excluir.')}await abrirFinanceiro('Lançamento excluído do PostgreSQL.')}catch(erro){mostrarMensagem(erro.message,true)}}
    function abrirAtividades(){const h=ultimos('nexoterra_atividades',i=>`<div class="registro"><strong>${escapar(i.atividade)}</strong><span>${escapar(i.responsavel)} | ${escapar(i.data)}</span></div>`);tela('Atividades','Organize tarefas e responsáveis.',`<form onsubmit="salvarAtividade(event)"><label>Atividade</label><input name="atividade" required><label>Responsável</label><input name="responsavel" required><label>Data</label><input name="data" type="date" value="${hoje()}" required><button>Salvar atividade</button>${voltar}</form>`,h)}
    function salvarAtividade(e){e.preventDefault();const f=e.target;gravar('nexoterra_atividades',{atividade:f.atividade.value,responsavel:f.responsavel.value,data:f.data.value});abrirAtividades();document.querySelector('#mensagem').textContent='Atividade salva.'}
    function abrirDiagnostico(){const h=ultimos('nexoterra_diagnosticos',i=>`<div class="registro"><strong>${escapar(i.problema)} — ${escapar(i.prioridade)}</strong><span>${escapar(i.acao)}</span></div>`);tela('Diagnóstico rural','Registre problemas e ações recomendadas.',`<form onsubmit="salvarDiagnostico(event)"><label>Problema</label><input name="problema" required><label>Prioridade</label><select name="prioridade" required><option value="">Selecione</option><option>Baixa</option><option>Média</option><option>Alta</option></select><label>Ação recomendada</label><textarea name="acao" required></textarea><button>Salvar diagnóstico</button>${voltar}</form>`,h)}
    function salvarDiagnostico(e){e.preventDefault();const f=e.target;gravar('nexoterra_diagnosticos',{problema:f.problema.value,prioridade:f.prioridade.value,acao:f.acao.value});abrirDiagnostico();document.querySelector('#mensagem').textContent='Diagnóstico salvo.'}
    abrirPainel();
  </script>
</body>
</html>
